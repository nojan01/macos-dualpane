name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # Tauris Build-Skript prueft die in tauri.conf.json angemeldeten Sidecars.
      # Ohne rclone bricht schon 'cargo clippy' ab ("resource path ... doesn't
      # exist"). Die Datei ist bewusst nicht eingecheckt (~78 MB), das Skript
      # laedt sie und prueft ihre Pruefsumme.
      - name: Fetch rclone sidecar
        run: bash scripts/fetch-rclone.sh

      - name: Test and build frontend
        run: |
          npm test
          npm run build

      - name: Format and lint Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cd src-tauri
          cargo audit
