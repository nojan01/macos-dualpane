name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Match the Rust toolchain used to build and validate the macOS release.
      # Floating stable can introduce new deny-warnings lints after validation.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: |
          npm install --global npm@11.21.3
          npm ci

      - name: Audit frontend and build dependencies
        run: npm audit --audit-level=low

      # Tauris Build-Skript prueft die in tauri.conf.json angemeldeten Sidecars.
      # Ohne rclone bricht schon 'cargo clippy' ab ("resource path ... doesn't
      # exist"). Die Datei ist bewusst nicht eingecheckt (~78 MB), das Skript
      # baut sie reproduzierbar und prueft ihre Pruefsumme.
      - name: Fetch rclone sidecar
        run: bash scripts/fetch-rclone.sh

      - name: Audit bundled Go dependencies
        run: |
          python3 scripts/test_audit_rclone.py
          case "$(uname -m)" in
            arm64) binary=src-tauri/binaries/rclone-aarch64-apple-darwin ;;
            x86_64) binary=src-tauri/binaries/rclone-x86_64-apple-darwin ;;
            *) exit 1 ;;
          esac
          python3 scripts/audit-rclone.py "$binary"

      - name: Test and build frontend
        run: |
          npm test
          npm run build

      - name: Format and lint Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cd src-tauri
          cargo audit
